app:
  description: 'Exemplo do tutorial com resumo conferido. Não corresponde a nenhum cenário. Fonte: IBGE SIDRA, Censo 2022, tabela 9605.'
  icon: 🧭
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  name: A9 | Exemplo cor ou raça
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: inicio
      type: custom
      data:
        title: Entrada
        desc: ''
        selected: false
        type: start
        variables:
        - label: Código IBGE do município (7 dígitos)
          max_length: 40
          options: []
          required: true
          type: text-input
          variable: codigo_ibge
      position:
        x: 30
        y: 220
      positionAbsolute:
        x: 30
        y: 220
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: consulta
      type: custom
      data:
        title: Consultar IBGE SIDRA
        desc: ''
        selected: false
        type: http-request
        authorization:
          type: no-auth
          config: null
        body:
          type: none
          data: []
        headers: ''
        method: get
        params: ''
        url: https://apisidra.ibge.gov.br/values/t/9605/n6/{{#inicio.codigo_ibge#}}/v/93/p/2022/c86/2776,2777,2779
        ssl_verify: true
        timeout:
          connect: 10
          read: 30
          write: 30
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 1000
      position:
        x: 350
        y: 220
      positionAbsolute:
        x: 350
        y: 220
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: contrato
      type: custom
      data:
        title: Validar e montar contrato
        desc: ''
        selected: false
        type: code
        code: |
          function main({ codigo_ibge, status_code, body }) {
            const base = { fonte: "IBGE SIDRA, Censo 2022, tabela 9605", codigo_ibge }
            if (status_code !== 200) {
              return { ok: 0, contrato: { ok: false, ...base, status_http: status_code, erro: "Consulta HTTP sem sucesso" } }
            }
            const valores = {}
            for (const linha of JSON.parse(body).slice(1)) {
              const categorias = Object.keys(linha).filter((k) => /^D[4-9]N$/.test(k)).sort().map((k) => linha[k])
              valores[[linha.D2C, ...categorias, linha.D3N].join("|")] = linha.V
            }
            if (Object.keys(valores).length === 0) {
              return { ok: 0, contrato: { ok: false, ...base, status_http: status_code, erro: "Resposta sem dados para o código" } }
            }
            const dados = { branca: parseInt(valores["93|Branca|2022"]), preta: parseInt(valores["93|Preta|2022"]), parda: parseInt(valores["93|Parda|2022"]) }
            return { ok: 1, contrato: { ok: true, ...base, dados } }
          }
        code_language: javascript
        variables:
        - variable: codigo_ibge
          value_selector:
          - inicio
          - codigo_ibge
        - variable: status_code
          value_selector:
          - consulta
          - status_code
        - variable: body
          value_selector:
          - consulta
          - body
        outputs:
          ok:
            type: number
            children: null
          contrato:
            type: object
            children: null
      position:
        x: 670
        y: 220
      positionAbsolute:
        x: 670
        y: 220
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: decisao
      type: custom
      data:
        title: Contrato válido?
        desc: ''
        selected: false
        type: if-else
        cases:
        - case_id: 'true'
          logical_operator: and
          conditions:
          - id: decisao-c1
            variable_selector:
            - contrato
            - ok
            comparison_operator: '='
            value: '1'
            varType: number
      position:
        x: 990
        y: 220
      positionAbsolute:
        x: 990
        y: 220
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: resumo
      type: custom
      data:
        title: Escrever resumo
        desc: ''
        selected: false
        type: llm
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        context:
          enabled: false
          variable_selector: []
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        prompt_template:
        - id: resumo-system
          role: system
          text: Você escreve para moradores do município. Escreva até três frases em português com os valores do contrato JSON recebido. Use os números como aparecem no contrato, sem arredondar e sem converter unidades. Não acrescente informações que não estejam no contrato.
        - id: resumo-user
          role: user
          text: '{{#contrato.contrato#}}'
        structured_output:
          enabled: false
        vision:
          configs:
            variable_selector: []
          enabled: false
        retry_config:
          enabled: true
          max_retries: 2
          retry_interval: 2000
          exponential_backoff:
            enabled: false
            max_interval: 10000
            multiplier: 2
      position:
        x: 1310
        y: 220
      positionAbsolute:
        x: 1310
        y: 220
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: conferir
      type: custom
      data:
        title: Conferir resumo
        desc: ''
        selected: false
        type: code
        code: |
          function main({ contrato, texto }) {
            const leituras = (t) => {
              const semPonto = t.replace(/\./g, "")
              if (t.includes(",")) return [Number(semPonto.replace(",", "."))]
              return [Number(t), Number(semPonto)]
            }
            const doContrato = (JSON.stringify(contrato).match(/\d+(\.\d+)?/g) || []).map(Number)
            const doTexto = texto.match(/\d+(?:[.,]\d+)*/g) || []
            const sem_origem = doTexto.filter((t) => !leituras(t).some((n) => doContrato.includes(n)))
            if (sem_origem.length > 0) {
              return { ok: 0, reprovado: { motivo: "Números do texto sem origem no contrato", sem_origem, texto } }
            }
            return { ok: 1, reprovado: {} }
          }
        code_language: javascript
        variables:
        - variable: contrato
          value_selector:
          - contrato
          - contrato
        - variable: texto
          value_selector:
          - resumo
          - text
        outputs:
          ok:
            type: number
            children: null
          reprovado:
            type: object
            children: null
      position:
        x: 1630
        y: 220
      positionAbsolute:
        x: 1630
        y: 220
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: aprovado
      type: custom
      data:
        title: Resumo aprovado?
        desc: ''
        selected: false
        type: if-else
        cases:
        - case_id: 'true'
          logical_operator: and
          conditions:
          - id: aprovado-c1
            variable_selector:
            - conferir
            - ok
            comparison_operator: '='
            value: '1'
            varType: number
      position:
        x: 1950
        y: 220
      positionAbsolute:
        x: 1950
        y: 220
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: saida
      type: custom
      data:
        title: Resumo aprovado
        desc: ''
        selected: false
        type: end
        outputs:
        - variable: contrato
          value_selector:
          - contrato
          - contrato
          value_type: object
        - variable: texto
          value_selector:
          - resumo
          - text
          value_type: string
      position:
        x: 2270
        y: 220
      positionAbsolute:
        x: 2270
        y: 220
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: saida_reprovado
      type: custom
      data:
        title: Resumo reprovado
        desc: ''
        selected: false
        type: end
        outputs:
        - variable: reprovado
          value_selector:
          - conferir
          - reprovado
          value_type: object
      position:
        x: 2270
        y: 480
      positionAbsolute:
        x: 2270
        y: 480
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    - id: saida_erro
      type: custom
      data:
        title: Erro no contrato
        desc: ''
        selected: false
        type: end
        outputs:
        - variable: erro
          value_selector:
          - contrato
          - contrato
          value_type: object
      position:
        x: 1310
        y: 480
      positionAbsolute:
        x: 1310
        y: 480
      width: 242
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      zIndex: 0
    edges:
    - id: inicio-source-consulta-target
      source: inicio
      sourceHandle: source
      target: consulta
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
    - id: consulta-source-contrato-target
      source: consulta
      sourceHandle: source
      target: contrato
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
    - id: contrato-source-decisao-target
      source: contrato
      sourceHandle: source
      target: decisao
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: if-else
    - id: decisao-true-resumo-target
      source: decisao
      sourceHandle: 'true'
      target: resumo
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: llm
    - id: resumo-source-conferir-target
      source: resumo
      sourceHandle: source
      target: conferir
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
    - id: conferir-source-aprovado-target
      source: conferir
      sourceHandle: source
      target: aprovado
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: if-else
    - id: aprovado-true-saida-target
      source: aprovado
      sourceHandle: 'true'
      target: saida
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: end
    - id: aprovado-false-saida_reprovado-target
      source: aprovado
      sourceHandle: 'false'
      target: saida_reprovado
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: end
    - id: decisao-false-saida_erro-target
      source: decisao
      sourceHandle: 'false'
      target: saida_erro
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
